name: skills/limit-break
category: skills
# Power-up estilo anime: pilar de energia ascendente + chispas en helice
# + anillo de tierra girando, rematado con un destello en el pico.
defaults:
  aura: SOUL_FIRE_FLAME
  spark: ELECTRIC_SPARK
steps:
  - id: surge
    type: PARALLEL
    steps:
      - id: pillar
        type: CYLINDER
        duration: 40
        params:
          particle: ${aura}
          radius: 1.3
          height: 4.0
          points-per-ring: 18
          rings: 8
      - id: rising
        type: HELIX
        duration: 40
        params:
          particle: ${spark}
          radius: 1.5
          height: 4.5
          turns: 6
          strands: 4
          count: 2
      - id: ground
        type: RING
        duration: 40
        params:
          particle: ${aura}
          radius: 2.0
          points: 30
          rotation-deg-per-tick: 12
          count: 1
  - id: peak
    type: BURST
    duration: 6
    params:
      particle: FLASH
      count: 6
      speed: 0.0
      spread: 0.3
