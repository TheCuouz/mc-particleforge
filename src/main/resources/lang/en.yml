# English overlay. Keys here override messages.yml.
# The studio chat prefix (◈ Particles ›) is provided by the TTS-SDK and is
# auto-prepended on send. Prepend "!" to suppress the prefix on fragments that
# are composed into another message via a placeholder (e.g. <desc> inside
# help-line) to avoid a double prefix.

no-permission: "<red>You don't have permission to use this command."
unknown-subcommand: "<red>Unknown subcommand <white><sub><red>. Try <white>/pf help<red>."
effect-not-found: "<red>Effect <white><effect><red> not found."
effect-started: "<gray>Playing <white><effect><gray>."
effect-stopped: "<gray>Stopped <white><count><gray> active effect(s)."
reloaded: "<green>Reloaded <white><count><green> effect(s) in <white><ms>ms<green>."
budget-rejected: "<yellow>Effect <white><effect><yellow> was rejected (budget full)."
debug-on: "<green>Debug logging <white>enabled<green>."
debug-off: "<gray>Debug logging <white>disabled<gray>."

help-header: "<gray>ParticleForge commands:"
help-line: "<gray>  /pf <white><sub><gray> — <i><desc>"

list-header: "<gray><count> effect(s) loaded:"
list-category: "<gray><b><category></b><reset>:"
list-line: "<gray>  • <white><effect><gray> <dark_gray>(<i><steps> steps</i>)"

info-header: "<gray>Effect <white><effect><gray>:"
info-line-category: "<gray>  category: <white><value>"
info-line-steps: "<gray>  steps: <white><value>"
info-line-duration: "<gray>  duration: <white><value> ticks"
info-line-default: "<gray>  default <white><key><gray>=<white><value>"

help-desc-preview: "!<gray>preview an effect at your location"
help-desc-list: "!<gray>list all loaded effects"
help-desc-info: "!<gray>show details about an effect"
help-desc-debug: "!<gray>toggle debug logging"
help-desc-reload: "!<gray>reload config and effects from disk"
help-desc-stop: "!<gray>stop active effects"
